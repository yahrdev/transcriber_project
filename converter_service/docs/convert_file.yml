#post:
tags:
  - Conversion
summary: Convert a file to a different format
description: |
  Accepts metadata about an already uploaded file, located in the shared input directory,
  and converts it to the specified target extension. Returns a path to the converted file.
operationId: convert_file
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: data
    required: true
    schema:
      type: object
      required:
        - file_path
        - target_filename
        - target_extension
      optional:
        - source_extension

      properties:
        file_path:
          type: string
          description: Full relative path to the input file in the shared input directory
          example: "tmp/input/abc123.mp4"
        target_filename:
          type: string
          description: Filename to use when saving the output file
          example: "abc123"
        source_extension:
          type: string
          description: Extension of the original input file
          example: "mp4"
        target_extension:
          type: string
          description: Desired output format
          example: "wav"
responses:
  200:
    description: File was successfully converted
    schema:
      type: object
      properties:
        file_path:
          type: string
          example: "/converter_output/abc123.mp3"
        file_name:
          type: string
          example: "abc123"
        file_extension:
          type: string
          example: "mp3"
  400:
    description: |
      Bad Request — input data is invalid or required fields are missing.
      Possible error codes:
      - VALIDATION_ERROR: One or more required fields are missing or empty.
      - FILE_WRONG_TYPE: 	The file {file_path} is not a supported media file.
    schema:
      $ref: '#/definitions/Message'
  422:
    description: |
      Unprocessable Entity — the conversion is not possible.
      Possible error codes:
      - UNSUPPORTED_EXTENSION: 	Unsupported extension: {value}. Supported: {supported}.
      - WRONG_CONVERSION: 	No converter for {from_ext} → {to_ext}.
      - EXTENSION_MISMATCH: 	Extracted extension from file_path ({ext}) does not equal to the specified '{expected}'.
      - INVALID_FILE_PATH: Invalid file path {file_path}. Make sure it includes a valid file_name and extension (e.g., .mp4).
    schema:
      $ref: '#/definitions/Message'
  404:
    description: |
      Not Found — the input file could not be located.
      Possible error codes:
      - FILE_NOT_FOUND_PATH: 	The file was not found at the path {file_path}.
      - ROUTE_NOT_FOUND: The requested URL was not found on the server.
    schema:
      $ref: '#/definitions/Message'
  500:
    description: |
      Internal Server Error — something went wrong while serving the file.
      Possible error code:
      - INTERNAL_ERROR
    schema:
      $ref: '#/definitions/Message'
