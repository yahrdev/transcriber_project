<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>Processing</title>
</head>

<body>

<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">

    <div class="w-100" style="max-width: 900px;">

        <h1 class="mb-4 text-center">
            Video Transcriber
        </h1>

        <!-- Progress block: visible while the job is pending / processing -->
        <div id="progress-block" class="card shadow-sm">
            <div class="card-body p-4">

                <h5 class="card-title mb-3">
                    Processing...
                </h5>

                <p class="text-muted">
                    Your video is being transcribed.
                </p>

                <div class="progress" style="height: 24px;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated"
                         style="width: 100%">
                        Processing
                    </div>
                </div>

            </div>
        </div>

        <!-- Error block: hidden until the job fails -->
        <div id="error-block" class="card shadow-sm border-0 border-top border-danger border-4 d-none">
            <div class="card-body p-5 text-center">

                <div class="mx-auto mb-4 d-flex justify-content-center align-items-center rounded-circle bg-danger bg-opacity-10"
                     style="width: 80px; height: 80px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"
                         fill="currentColor" class="text-danger" viewBox="0 0 16 16">
                        <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                    </svg>
                </div>

                <h5 class="card-title mb-2">
                    Something went wrong
                </h5>

                <p class="text-muted mb-4">
                    Try again.
                </p>

                <a href="/" class="btn btn-primary btn-lg">
                    Try again
                </a>

            </div>
        </div>

    </div>

</div>

<script>
    // Polling: the job is processed in the background by the Celery worker,
    // so the page asks /status/<job_id> every 2 seconds.
    // completed -> redirect to the result page, failed or request error -> show the error block.
    const jobId = "{{ job_id }}";
    const POLL_INTERVAL_MS = 2000;

    function showError() {
        document.getElementById("progress-block").classList.add("d-none");
        document.getElementById("error-block").classList.remove("d-none");
    }

    async function checkStatus() {
        try {
            const response = await fetch(`/status/${jobId}`);
            if (!response.ok) {
                showError();
                return;
            }

            const data = await response.json();

            if (data.status === "completed") {
                window.location.href = `/result/${jobId}`;
                return;
            }
            if (data.status === "failed") {
                showError();
                return;
            }

            setTimeout(checkStatus, POLL_INTERVAL_MS);
        } catch (error) {
            showError();
        }
    }

    checkStatus();
</script>

</body>
</html>
